name: Super MiniTV Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile ESP32-C3
        run: pio run
      - name: Verify firmware
        run: |
          test -f .pio/build/esp32-c3-devkitm-1/firmware.bin
          ls -lh .pio/build/esp32-c3-devkitm-1/firmware.bin
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Super-MiniTV-firmware
          path: |
            .pio/build/esp32-c3-devkitm-1/firmware.bin
            .pio/build/esp32-c3-devkitm-1/firmware.elf
